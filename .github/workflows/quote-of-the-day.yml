
name: Update Quote of the Day

on:
  schedule:
    # 07:05 Vietnam time (00:05 UTC)
    - cron: "5 0 * * *"

  # Allows manual execution from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-quote:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch today's quote
        id: quote
        run: |
          response=$(curl -fsSL "https://zenquotes.io/api/today")

          quote=$(echo "$response" | jq -r '.[0].q')
          author=$(echo "$response" | jq -r '.[0].a')

          echo "quote=$quote" >> "$GITHUB_OUTPUT"
          echo "author=$author" >> "$GITHUB_OUTPUT"

      - name: Update README
        env:
          QUOTE: ${{ steps.quote.outputs.quote }}
          AUTHOR: ${{ steps.quote.outputs.author }}
        run: |
          python <<'PY'
          import os
          import re

          path = "README.md"

          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          quote = os.environ["QUOTE"]
          author = os.environ["AUTHOR"]

          replacement = (
              "<!-- QUOTE:START -->\n"
              f'> "{quote}"\n'
              ">\n"
              f"> — {author}\n"
              "<!-- QUOTE:END -->"
          )

          pattern = r"<!-- QUOTE:START -->.*?<!-- QUOTE:END -->"

          updated = re.sub(
              pattern,
              replacement,
              content,
              flags=re.DOTALL
          )

          if updated == content:
              raise SystemExit(
                  "Quote markers were not found in README.md"
              )

          with open(path, "w", encoding="utf-8") as f:
              f.write(updated)
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update quote of the day"
          git push

